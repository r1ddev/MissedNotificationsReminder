name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 29
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;29.0.2"

      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair \
            -keystore ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          cat > keystore.properties <<'EOF'
          storeFile=ci-debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APKs
        run: |
          ./gradlew \
            assembleAccessibilityV14NoProprietaryDebug \
            assembleAccessibilityV14ProprietaryDebug \
            assembleAccessibilityV27NoProprietaryDebug \
            assembleAccessibilityV27ProprietaryDebug \
            assembleNotificationListenerV18NoProprietaryDebug \
            assembleNotificationListenerV18ProprietaryDebug \
            --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE="app/build/outputs/apk/notificationListenerV18NoProprietary/debug/MissedNotificationsReminder-notificationListener-v18-noProprietary-debug.apk"
          test -f "$APK_FILE"

          TAG="debug-${GITHUB_RUN_NUMBER}"
          TITLE="Debug build #${GITHUB_RUN_NUMBER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            while IFS= read -r ASSET; do
              if [ "$ASSET" != "$(basename "$APK_FILE")" ]; then
                gh release delete-asset "$TAG" "$ASSET" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Debug APK built from commit $GITHUB_SHA."
          fi

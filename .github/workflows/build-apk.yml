name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish release
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 29
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;29.0.2"

      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair \
            -keystore ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          cat > keystore.properties <<'EOF'
          storeFile=ci-debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleNotificationListenerV18NoProprietaryDebug --stacktrace

      - name: Prepare APK
        run: |
          mapfile -t APK_FILES < <(find app/build/outputs/apk/notificationListenerV18NoProprietary/debug -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#APK_FILES[@]}" -eq 1
          mkdir -p dist
          cp "${APK_FILES[0]}" dist/MissedNotificationsReminder.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MissedNotificationsReminder
          path: dist/MissedNotificationsReminder.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/MissedNotificationsReminder.apk"
          TAG="debug-${GITHUB_RUN_NUMBER}"
          TITLE="Debug build #${GITHUB_RUN_NUMBER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Android 4.3+ debug build from commit $GITHUB_SHA."
          fi
